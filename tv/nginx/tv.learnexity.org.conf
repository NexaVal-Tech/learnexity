# /etc/nginx/sites-available/tv.learnexity.org
#
# Serves the Learnexity TV webinar page straight from the git checkout,
# so deploying is just `git pull` — no copying files.
#
# CHANGE the two `root` lines below if your repo is not at /var/www/learnexity
# (run `pwd` inside the repo on the server to see the real path).

server {
    listen 80;
    listen [::]:80;
    server_name tv.learnexity.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tv.learnexity.org;

    ssl_certificate     /etc/letsencrypt/live/tv.learnexity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.learnexity.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    root /var/www/learnexity/tv;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The page itself (tv.html) — also answers the Stripe/Paystack return
    # URLs like /?payment=success&...
    location = / {
        try_files /tv.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images
    location /assets/ {
        location ~* \.(png|jpe?g|webp|svg|ico)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
        return 404; # nothing else in assets/ (e.g. README.txt) is public
    }

    # Everything else in the folder (nginx config, readme, .git…) stays private
    location / {
        return 404;
    }

    access_log /var/log/nginx/tv.learnexity.org.access.log;
    error_log  /var/log/nginx/tv.learnexity.org.error.log;
}
