# /etc/nginx/sites-available/advisory.learnexity.org
#
# Reverse proxy for the Advisory Next.js app.
# The app itself is NOT served by nginx directly — it must be running as a
# Node process on port 3001 (see advisory/package.json -> "start": "next start -p 3001").
#
# Deploy steps on the VPS:
#   1. cd /path/to/learnexity/advisory && npm install && npm run build
#   2. Run it as a long-lived process, e.g. with pm2:
#        pm2 start npm --name advisory -- start
#        pm2 save
#   3. sudo cp advisory.learnexity.org.conf /etc/nginx/sites-available/advisory.learnexity.org
#      sudo ln -s /etc/nginx/sites-available/advisory.learnexity.org /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d advisory.learnexity.org   (issues the cert + rewrites the 443 block for you)
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream advisory_app {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Plain HTTP: only exists to answer the ACME challenge and redirect everything else to HTTPS.
# certbot will edit/expand this block automatically when you run step 4 above.
server {
    listen 80;
    listen [::]:80;
    server_name advisory.learnexity.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name advisory.learnexity.org;

    ssl_certificate     /etc/letsencrypt/live/advisory.learnexity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/advisory.learnexity.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed, immutable build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://advisory_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything in /public (logo, favicon, etc.)
    location /images/ {
        proxy_pass http://advisory_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://advisory_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/advisory.learnexity.org.access.log;
    error_log  /var/log/nginx/advisory.learnexity.org.error.log;
}
