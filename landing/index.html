<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepare for Remote Opportunities in the US and Beyond | Learnexity</title>
  <meta name="description" content="Build high-demand tech skills, understand the US and global job markets, and position yourself for greater opportunities with Learnexity.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Prepare for Remote Opportunities in the US and Beyond | Learnexity">
  <meta property="og:description" content="Build high-demand tech skills, understand the US and global job markets, and position yourself for greater opportunities.">
  <meta property="og:image" content="assets/hero.jpg">
  <meta name="theme-color" content="#4A3AFF">
  <link rel="icon" href="favicon.ico">
  <link rel="preload" as="image" href="assets/hero.jpg">
  <style>
    /* ───────────────────────────────────────────────────────────────
       Same design tokens as learnexity.org (frontend/styles/globals.css):
       system font stack, light/dark colours that follow the visitor's
       system setting, max-w-screen-xl (1280px) + 24px gutters, Tailwind
       type scale (text-xl = 20px, text-4xl/5xl/6xl = 36/48/60px), brand
       #4A3AFF, cards with the 2rem/0.75rem asymmetric corners.
       ─────────────────────────────────────────────────────────────── */
    :root {
      --brand: #4A3AFF;
      --brand-hover: #3A2AFF;
      --brand-nav: #6C63FF;
      --text-primary: #0f0f14;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --surface: #fff;
      --surface-elevated: #fff;
      --surface-alt: #f3f4f6;
      --border-subtle: #0f0f141a;
      --border-strong: #0f0f142e;
      --page-bg: #fff;
      --body-text: #171717;
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --r: 2rem 0.75rem 2rem 0.75rem;
      --r-sm: 1.25rem 0.5rem 1.25rem 0.5rem;
      --font: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #fff;
        --text-secondary: #c7c9d1;
        --text-muted: #9098a8;
        --surface: #0f0f0f;
        --surface-elevated: #0f0f0fe6;
        --surface-alt: #15151f;
        --border-subtle: #ffffff1a;
        --border-strong: #ffffff2e;
        --page-bg: #0a0a0f;
        --body-text: #ededed;
        --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5;
      color: var(--body-text); background: var(--page-bg); -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1280px; margin-inline: auto; padding-inline: 24px; }
    section { padding: 64px 0; }
    @media (min-width: 768px) { section { padding: 80px 0; } }

    /* Section header — same as Pathways / "Meet our grads" */
    .label { font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand); margin-bottom: 8px; }
    .h2 { font-size: 36px; line-height: 1.25; font-weight: 600; color: var(--text-primary); }
    @media (min-width: 768px) { .h2 { font-size: 48px; } }
    .lead { margin-top: 16px; font-size: 20px; line-height: 1.625; color: var(--text-secondary); }
    .head { margin-bottom: 40px; }
    .head.center { text-align: center; max-width: 48rem; margin-inline: auto; }

    /* Buttons — same as the site's CMS buttons */
    .ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 40px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 20px; min-height: 44px; border-radius: 9999px; font-family: inherit;
      font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none;
      border: 2px solid transparent; transition: background-color .15s, color .15s, border-color .15s; cursor: pointer;
    }
    @media (min-width: 768px) { .btn { font-size: 18px; line-height: 28px; } }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-light { background: #fff; color: var(--brand-nav); }
    .btn-light:hover { background: #f9fafb; }
    .btn-outline { border-color: currentColor; color: var(--text-primary); }
    .btn-outline:hover { background: var(--surface-alt); }
    .btn-ghost { border-color: rgba(255,255,255,.7); color: var(--text-primary); border-color: var(--border-strong); }
    .btn-ghost:hover { background: var(--surface-alt); }
    .on-dark .btn-outline, .on-dark .btn-ghost { border-color: rgba(255,255,255,.7); color: #fff; }
    .on-dark .btn-outline:hover, .on-dark .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .hero .btn { border-radius: 8px; }
    @media (max-width: 639px) {
      .ctas.stack { flex-direction: column; align-items: stretch; max-width: 24rem; gap: 12px; }
      .ctas.stack .btn { width: 100%; }
    }

    /* Navbar — white bar like learnexity.org */
    header.top { position: fixed; inset: 0 0 auto 0; z-index: 50; background: #fff; border-bottom: 1px solid #f3f4f6; transition: box-shadow .3s; }
    header.top.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.06); }
    header.top .bar { display: flex; align-items: center; justify-content: space-between; height: 62px; }
    header.top .logo img { max-height: 38px; width: auto; }
    header.top .nav-btn {
      background: var(--brand-nav); color: #fff; font-size: 13px; font-weight: 600; padding: 10px 20px;
      border-radius: 12px; text-decoration: none; transition: background .2s; white-space: nowrap;
    }
    header.top .nav-btn:hover { background: #5753E6; }

    /* Hero — same as the homepage hero */
    .hero { position: relative; overflow: hidden; background: #000; padding: 126px 0 64px; min-height: 60vh; display: flex; align-items: center; color: #fff; }
    @media (min-width: 768px) { .hero { min-height: 80vh; } }
    .hero .bg { position: absolute; inset: 0; z-index: 0; }
    .hero .bg img { width: 100%; height: 100%; object-fit: cover; }
    .hero .overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(135deg, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0.65) 100%); }
    .hero .inner { position: relative; z-index: 10; width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: 20px; }
    @media (min-width: 640px) { .hero .inner { padding-inline: 32px; } }
    .hero .content { max-width: 64rem; }
    .pill {
      display: inline-flex; align-items: center; padding: 8px 16px; margin-bottom: 20px; border-radius: 9999px;
      background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(71, 85, 105, 0.7); color: #e0e7ff;
      font-size: 14px; font-weight: 500; backdrop-filter: blur(4px);
    }
    .pill .dot { width: 8px; height: 8px; border-radius: 9999px; margin-right: 8px; background: #8b7cff; flex-shrink: 0; animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (min-width: 768px) { .pill { padding: 12px 32px; font-size: 20px; margin-bottom: 28px; } .pill .dot { width: 12px; height: 12px; margin-right: 12px; } }
    @media (min-width: 1024px) { .pill { padding: 16px 48px; font-size: 28px; letter-spacing: .025em; } .pill .dot { margin-right: 16px; } }
    .hero h1 { font-size: 36px; line-height: 1.25; font-weight: 700; color: #fff; }
    @media (min-width: 640px) { .hero h1 { font-size: 48px; } }
    @media (min-width: 1024px) { .hero h1 { font-size: 60px; } }
    .hero h1 .hl { color: #a5b4fc; }
    .hero .sub { margin-top: 16px; max-width: 42rem; font-size: 18px; line-height: 1.625; color: #e5e7eb; }
    @media (min-width: 640px) { .hero .sub { font-size: 20px; } }
    @media (min-width: 768px) { .hero .sub { font-size: 24px; } }

    /* Cards — same as "Why choose Learnexity" cards */
    .card {
      background: var(--surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--r);
      box-shadow: var(--card-shadow); padding: 32px 24px; transition: transform .3s;
    }
    .card:hover { transform: translateY(-8px); }
    .card h3 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .card p { font-size: 20px; line-height: 28px; color: var(--text-secondary); }
    .num { font-size: 14px; font-weight: 600; letter-spacing: .1em; color: #4A3AFF99; margin-bottom: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .media { border-radius: var(--r); overflow: hidden; background: var(--surface-alt); border: 1px solid var(--border-subtle); box-shadow: var(--card-shadow); }
    .media img { width: 100%; height: 100%; object-fit: cover; }

    /* Intro */
    .intro .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .intro .media { aspect-ratio: 4 / 3; }
    .intro .copy p { font-size: 20px; line-height: 1.625; color: var(--text-secondary); }
    .intro .copy p + p { margin-top: 24px; color: var(--text-primary); }
    @media (max-width: 899px) { .intro .grid { grid-template-columns: 1fr; gap: 40px; } }

    /* What you will gain */
    .gain .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .gain .media { grid-row: span var(--rows, 2); min-height: 100%; }
    @media (min-width: 640px) { .gain .card.wide { grid-column: span 2; } }
    @media (max-width: 1023px) { .gain .grid { grid-template-columns: 1fr 1fr; } .gain .media { grid-column: span 2; grid-row: auto; aspect-ratio: 16 / 9; } }
    @media (max-width: 639px) { .gain .grid { grid-template-columns: 1fr; } .gain .media { grid-column: auto; } }

    /* Image + text sections */
    .split .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .split.reverse .media { order: 2; }
    .split .media { aspect-ratio: 4 / 3; }
    @media (max-width: 899px) { .split .grid { grid-template-columns: 1fr; gap: 40px; } .split.reverse .media { order: 0; } }

    /* How it works */
    .how .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: start; }
    .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
    .steps li { display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: start; padding: 24px; }
    .steps .n { width: 56px; height: 56px; border-radius: 1rem 0.4rem 1rem 0.4rem; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
    .steps h3 { margin-bottom: 4px; }
    .how .media { position: sticky; top: 92px; aspect-ratio: 4 / 4.6; }
    @media (max-width: 899px) { .how .grid { grid-template-columns: 1fr; } .how .media { position: static; aspect-ratio: 16 / 10; } }

    /* Offer */
    .panel { background: var(--surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--r); box-shadow: var(--card-shadow); padding: 32px 24px; }
    @media (min-width: 768px) { .panel { padding: 40px; } }
    .offer .top-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 32px; }
    .countdown { display: flex; gap: 8px; }
    .countdown div { min-width: 72px; text-align: center; padding: 10px 8px; background: var(--surface-alt); border: 1px solid var(--border-subtle); border-radius: 1rem 0.4rem 1rem 0.4rem; }
    .countdown b { display: block; font-size: 28px; line-height: 1.1; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
    .countdown span { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .table { border: 1px solid var(--border-subtle); border-radius: 1.25rem 0.5rem 1.25rem 0.5rem; overflow: hidden; }
    .tr { display: grid; grid-template-columns: 1.3fr 1fr 1.2fr auto; gap: 16px; align-items: center; padding: 20px 24px; border-top: 1px solid var(--border-subtle); }
    .tr.th { border-top: 0; background: var(--surface-alt); font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding-block: 14px; }
    .tr .prog { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--text-primary); }
    .tr .reg { font-size: 20px; color: var(--text-muted); text-decoration: line-through; }
    .tr .fee { font-size: 30px; line-height: 36px; font-weight: 700; color: var(--brand); }
    .tr .go { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; min-height: 44px; border-radius: 9999px; background: var(--brand); color: #fff; font-weight: 600; font-size: 16px; text-decoration: none; white-space: nowrap; }
    .tr .go:hover { background: var(--brand-hover); }
    .tr .go svg { width: 16px; height: 16px; }
    .cell-label { display: none; }
    .offer .foot { margin-top: 20px; font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .webinar { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 16px 20px; border: 1px solid var(--border-subtle); border-radius: 1.25rem 0.5rem 1.25rem 0.5rem; background: var(--surface-alt); }
    .webinar p { display: flex; align-items: flex-start; gap: 10px; font-size: 16px; line-height: 1.5; color: var(--text-secondary); flex: 1 1 320px; }
    .webinar p::before { content: ''; flex: 0 0 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: #8b7cff; }
    .webinar a, .webinar button { font-family: inherit; cursor: pointer; background: transparent; }
    .webinar a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; min-height: 44px; border-radius: 9999px; border: 1px solid var(--brand); color: var(--text-primary); font-weight: 600; font-size: 16px; text-decoration: none; white-space: nowrap; }
    .webinar a svg, .webinar button svg { width: 16px; height: 16px; flex: 0 0 16px; }
    .webinar button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; min-height: 44px; border-radius: 9999px; border: 0; background: var(--brand); color: #fff; font-weight: 600; font-size: 16px; white-space: nowrap; }
    .webinar a:hover { background: var(--brand); color: #fff; }
    .webinar button:hover { background: #3b2de0; }
    @media (max-width: 639px) { .webinar a, .webinar button { width: 100%; justify-content: center; } }

    /* Webinar registration modal */
    .wf-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(5,5,12,.72); display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: wfIn .18s ease-out; }
    @media (min-width: 640px) { .wf-backdrop { align-items: center; padding: 24px; } }
    @keyframes wfIn { from { opacity: 0; } to { opacity: 1; } }
    .wf { width: 100%; max-width: 520px; max-height: 100dvh; overflow-y: auto; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 1.5rem 1.5rem 0 0; padding: 28px 22px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 25px 50px -12px rgba(0,0,0,.6); position: relative; }
    @media (min-width: 640px) { .wf { border-radius: 2rem .75rem 2rem .75rem; padding: 32px; max-height: 92vh; } }
    .wf h3 { font-size: 24px; line-height: 1.25; font-weight: 600; padding-right: 36px; }
    .wf .sub { margin-top: 8px; font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
    .wf .when { margin-top: 12px; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; color: var(--brand); background: rgba(74,58,255,.1); border-radius: 9999px; padding: 6px 12px; }
    .wf .x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-muted); font-size: 26px; line-height: 1; cursor: pointer; }
    .wf .x:hover { background: var(--surface-alt); color: var(--text-primary); }
    .wf form { margin-top: 20px; display: grid; gap: 14px; }
    .wf label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .wf input, .wf select, .wf textarea { width: 100%; font: inherit; font-size: 16px; font-weight: 400; color: var(--text-primary); background: var(--surface-alt); border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px 14px; min-height: 48px; outline: none; -webkit-appearance: none; appearance: none; }
    .wf select { background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    .wf textarea { min-height: 84px; resize: vertical; }
    .wf input:focus, .wf select:focus, .wf textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(74,58,255,.25); }
    .wf .err { font-size: 13px; font-weight: 500; color: #f87171; }
    .wf .formerr { font-size: 14px; color: #f87171; }
    .wf .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .wf .submit { margin-top: 4px; width: 100%; min-height: 52px; border: 0; border-radius: 9999px; background: var(--brand); color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .wf .submit:disabled { opacity: .65; cursor: wait; }
    .wf .ok { text-align: center; padding-top: 8px; }
    .wf .ok .tick { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: rgba(74,58,255,.12); color: var(--brand); display: flex; align-items: center; justify-content: center; }
    .wf .ok .tick svg { width: 32px; height: 32px; }
    .wf .ok h3 { padding-right: 0; }
    .wf .wa { margin-top: 22px; width: 100%; min-height: 52px; border-radius: 9999px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .wf .wa svg { width: 22px; height: 22px; }
    .wf .later { margin-top: 10px; width: 100%; min-height: 48px; border-radius: 9999px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font: inherit; font-weight: 600; cursor: pointer; }
    .ended { padding: 32px; border: 1px dashed var(--border-strong); border-radius: 1.25rem 0.5rem 1.25rem 0.5rem; background: var(--surface-alt); }
    .ended h3 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--text-primary); }
    .ended p { margin-top: 8px; font-size: 20px; line-height: 1.625; color: var(--text-secondary); }
    @media (max-width: 767px) {
      .tr.th { display: none; }
      .tr { grid-template-columns: 1fr 1fr; row-gap: 8px; }
      .tr .prog, .tr .go { grid-column: 1 / -1; }
      .tr .go { justify-content: center; }
      .cell-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
      .countdown div { min-width: 62px; }
    }

    /* Discover */
    .events { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .event { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .event .pic { position: relative; aspect-ratio: 16 / 9; background: var(--surface-alt); }
    .event .pic img { width: 100%; height: 100%; object-fit: cover; }
    .event .badge { position: absolute; left: 16px; top: 16px; background: var(--brand); color: #fff; font-weight: 600; font-size: 14px; padding: 6px 14px; border-radius: 9999px; }
    .event .body { padding: 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .event .body p { flex: 1; }
    .event .btn { align-self: flex-start; margin-top: 16px; }

    /* Instructors — like the Meet Our Team cards */
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
    .person { padding: 0; overflow: hidden; position: relative; }
    .person .ph { position: relative; height: 320px; background: linear-gradient(135deg, rgba(74,58,255,.08), #18181f); }
    .person .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
    .person .ph .ini { width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-size: 48px; font-weight: 700; }
    .person .in { position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 12px; background: #0A66C2; color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(10,102,194,.45); border: 2px solid rgba(255,255,255,.9); }
    .person .in svg { width: 22px; height: 22px; }
    .person .meta { padding: 24px 28px 28px; }
    .person .role { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--brand); }
    .person h3 { font-size: 19px; line-height: 1.2; font-weight: 700; color: var(--text-primary); margin-top: 8px; }
    .more-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 40px; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--text-primary); color: var(--text-primary); font-weight: 600; text-decoration: none; transition: all .2s; }
    .more-link:hover { border-color: var(--brand); color: var(--brand); gap: 12px; }
    .more-link svg { width: 18px; height: 18px; }

    /* Closing + footer — same purple band as the site footer */
    .site-footer { background: #5B1EF6; color: #fff; padding: 56px 0 24px; }
    .site-footer h2 { font-size: 36px; line-height: 1.25; font-weight: 600; text-align: center; margin-bottom: 16px; }
    @media (min-width: 768px) { .site-footer h2 { font-size: 48px; } }
    .site-footer .ctas { justify-content: center; margin-top: 24px; }
    .site-footer .btn-primary { background: #fff; color: #6D4AFF; }

    var COUNTRIES = ['Nigeria','United States','United Kingdom','Canada','Ghana','Kenya','South Africa','Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda','Argentina','Armenia','Australia','Austria','Azerbaijan','Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi','Cabo Verde','Cambodia','Cameroon','Central African Republic','Chad','Chile','China','Colombia','Comoros','Congo','Costa Rica','Cote d\'Ivoire','Croatia','Cuba','Cyprus','Czechia','Democratic Republic of the Congo','Denmark','Djibouti','Dominica','Dominican Republic','Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia','Eswatini','Ethiopia','Fiji','Finland','France','Gabon','Gambia','Georgia','Germany','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau','Guyana','Haiti','Honduras','Hong Kong','Hungary','Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Jamaica','Japan','Jordan','Kazakhstan','Kiribati','Kosovo','Kuwait','Kyrgyzstan','Laos','Latvia','Lebanon','Lesotho','Liberia','Libya','Liechtenstein','Lithuania','Luxembourg','Madagascar','Malawi','Malaysia','Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico','Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique','Myanmar','Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua','Niger','North Korea','North Macedonia','Norway','Oman','Pakistan','Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines','Poland','Portugal','Puerto Rico','Qatar','Romania','Russia','Rwanda','Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino','Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles','Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia','South Korea','South Sudan','Spain','Sri Lanka','Sudan','Suriname','Sweden','Switzerland','Syria','Taiwan','Tajikistan','Tanzania','Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia','Turkey','Turkmenistan','Tuvalu','Uganda','Ukraine','United Arab Emirates','Uruguay','Uzbekistan','Vanuatu','Vatican City','Venezuela','Vietnam','Yemen','Zambia','Zimbabwe','Other'];
    var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    var WHATSAPP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.57.93.95-3.48-.22-.36a9.37 9.37 0 0 1-1.44-5c0-5.18 4.22-9.4 9.42-9.4 2.51 0 4.88.98 6.65 2.76a9.34 9.34 0 0 1 2.75 6.65c0 5.19-4.22 9.4-9.39 9.4zm8-17.4A11.26 11.26 0 0 0 12.05.75C5.82.75.75 5.82.75 12.05c0 1.99.52 3.94 1.51 5.65L.65 23.25l5.68-1.49a11.3 11.3 0 0 0 5.4 1.38h.01c6.23 0 11.3-5.07 11.3-11.3 0-3.02-1.18-5.86-3.31-8z"/></svg>';

    function openWebinarForm() {
      var f = Object.assign({}, DEFAULTS.webinar_form, (lastData && lastData.content && lastData.content.webinar_form) || {});
      var prevFocus = document.activeElement;
      var prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';

      var box = el('div', { class: 'wf', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'wfTitle' });
      var backdrop = el('div', { class: 'wf-backdrop' }, [box]);
      function close() {
        document.removeEventListener('keydown', onKey);
        backdrop.remove();
        document.body.style.overflow = prevOverflow;
        if (prevFocus && prevFocus.focus) prevFocus.focus();
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });

      var x = el('button', { type: 'button', class: 'x', 'aria-label': 'Close' }, ['×']);
      x.addEventListener('click', close);

      function field(label, input, name) {
        var err = el('span', { class: 'err', id: 'wfErr_' + name, role: 'alert' });
        input.setAttribute('aria-describedby', 'wfErr_' + name);
        return { wrap: el('label', {}, [label, input, err]), err: err, input: input };
      }
      var nameF = field(f.label_name, el('input', { name: 'name', type: 'text', autocomplete: 'name', required: true, maxlength: '120' }), 'name');
      var emailF = field(f.label_email, el('input', { name: 'email', type: 'email', autocomplete: 'email', inputmode: 'email', required: true, maxlength: '190' }), 'email');
      var sel = el('select', { name: 'country', required: true, autocomplete: 'country-name' }, [el('option', { value: '', text: 'Select your country' })]);
      COUNTRIES.forEach(function (c) { sel.appendChild(el('option', { value: c, text: c })); });
      var countryF = field(f.label_country, sel, 'country');
      var learnF = field(f.label_learn, el('textarea', { name: 'interest', rows: '2', maxlength: '500', placeholder: 'e.g. Cloud computing, data analysis, AI…' }), 'interest');
      var heardF = field(f.label_heard, el('input', { name: 'heard_from', type: 'text', maxlength: '300', placeholder: 'e.g. Instagram, a friend, Google…' }), 'heard_from');
      var hp = el('div', { class: 'hp', 'aria-hidden': 'true' }, [el('input', { name: 'website', type: 'text', tabindex: '-1', autocomplete: 'off' })]);
      var formErr = el('p', { class: 'formerr', role: 'alert' });
      var submit = el('button', { type: 'submit', class: 'submit' }, [f.submit_label || 'Register free']);
      var fields = { name: nameF, email: emailF, country: countryF, interest: learnF, heard_from: heardF };

      var form = el('form', { novalidate: true }, [nameF.wrap, emailF.wrap, countryF.wrap, learnF.wrap, heardF.wrap, hp, formErr, submit]);
      var head = [x, el('h3', { id: 'wfTitle', text: f.heading || 'Register for our free webinar' })];
      if (f.webinar_title) head.push(el('p', { class: 'sub', text: f.webinar_title }));
      if (f.webinar_when) head.push(el('p', { class: 'when', text: f.webinar_when }));
      if (f.text) head.push(el('p', { class: 'sub', text: f.text }));
      head.concat([form]).forEach(function (n) { box.appendChild(n); });
      document.body.appendChild(backdrop);
      setTimeout(function () { nameF.input.focus(); }, 30);

      function showSuccess(waUrl) {
        box.textContent = '';
        var wa = el('a', { class: 'wa', href: waUrl, target: '_blank', rel: 'noopener noreferrer' }, [icon(WHATSAPP), f.whatsapp_label || 'Get Expert Guidance']);
        var later = el('button', { type: 'button', class: 'later' }, ['Close']);
        later.addEventListener('click', close);
        var x2 = el('button', { type: 'button', class: 'x', 'aria-label': 'Close' }, ['×']);
        x2.addEventListener('click', close);
        box.appendChild(x2);
        box.appendChild(el('div', { class: 'ok' }, [
          el('div', { class: 'tick' }, [icon(CHECK)]),
          el('h3', { id: 'wfTitle', text: f.success_heading || "You're registered!" }),
          el('p', { class: 'sub', text: f.success_text || '' }),
          wa, later
        ]));
        wa.focus();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        Object.keys(fields).forEach(function (k) { fields[k].err.textContent = ''; fields[k].input.removeAttribute('aria-invalid'); });
        formErr.textContent = '';
        var data = {
          name: nameF.input.value.trim(), email: emailF.input.value.trim(), country: sel.value,
          interest: learnF.input.value.trim(), heard_from: heardF.input.value.trim(),
          website: hp.querySelector('input').value
        };
        var bad = false;
        function fail(k, msg) { fields[k].err.textContent = msg; fields[k].input.setAttribute('aria-invalid', 'true'); if (!bad) fields[k].input.focus(); bad = true; }
        if (data.name.length < 2) fail('name', 'Please enter your name.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email)) fail('email', 'Please enter a valid email address.');
        if (!data.country) fail('country', 'Please choose your country.');
        if (bad) return;

        submit.disabled = true;
        submit.textContent = 'Registering…';
        fetch(API + '/api/landing/webinar-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(data)
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
        }).then(function (res) {
          if (res.status === 200 || res.status === 201) {
            if (window.fbq) { try { window.fbq('track', 'Lead'); } catch (err) { /* ignore */ } }
            var digits = String(f.whatsapp_number || '12762528415').replace(/\D+/g, '');
            var fallback = 'https://wa.me/' + digits + (f.whatsapp_message ? '?text=' + encodeURIComponent(f.whatsapp_message) : '');
            var url = res.body && /^https:\/\/wa\.me\//.test(res.body.whatsapp_url || '') ? res.body.whatsapp_url : fallback;
            showSuccess(url);
            return;
          }
          if (res.status === 422 && res.body && res.body.errors) {
            Object.keys(res.body.errors).forEach(function (k) { if (fields[k]) fail(k, String(res.body.errors[k][0] || 'Please check this field.')); });
            if (!bad) formErr.textContent = res.body.message || 'Please check the form.';
          } else if (res.status === 429) {
            formErr.textContent = 'Too many attempts. Please wait a minute and try again.';
          } else {
            formErr.textContent = 'Something went wrong. Please try again.';
          }
          submit.disabled = false;
          submit.textContent = f.submit_label || 'Register free';
        }).catch(function () {
          formErr.textContent = 'Network error. Please check your connection and try again.';
          submit.disabled = false;
          submit.textContent = f.submit_label || 'Register free';
        });
      });
    }

    /* ── Render ─────────────────────────────────────────────────────── */
    var lastData = null;
    function render(data) {
      lastData = data;
      var c = data.content, ctas = c.ctas || [];
      var offset = data.server_time ? (new Date(data.server_time).getTime() - Date.now()) : 0;
      var app = document.getElementById('app');
      app.textContent = '';
      var parts = [
        c.hero.show && hero(c.hero, ctas),
        c.intro.show && intro(c.intro),
        c.gain.show && gain(c.gain),
        c.who.show && split(c.who, ctas, false, 'who', 'Adult learners in a training session'),
        c.how.show && how(c.how),
        c.offer.show && offer(c.offer, data.currency || 'USD', offset),
        c.pathway.show && split(c.pathway, ctas, true, 'pathway', 'Learner taking an online assessment'),
        c.discover.show && discover(c.discover),
        c.instructors.show && instructors(c.instructors, data.instructors)
      ];
      closing(c.closing, ctas);
      parts.forEach(function (p) { if (p) app.appendChild(p); });

      if (c.seo) {
        if (c.seo.title) document.title = c.seo.title;
        var d = document.querySelector('meta[name="description"]'); if (d && c.seo.description) d.setAttribute('content', c.seo.description);
      }
      // Header button = the "eligibility" CTA if present, else the first one.
      var hb = document.getElementById('headerCta');
      var pick = ctas.filter(function (b) { return /eligib|screen/i.test(b.label || ''); })[0] || ctas[0];
      if (pick && href(pick.href)) { hb.textContent = pick.label; hb.href = href(pick.href); hb.hidden = false; } else hb.hidden = true;
      observeReveal();
    }

    function observeReveal() {
      var els = document.querySelectorAll('.reveal:not(.in)');
      if (typeof window.IntersectionObserver !== 'function') { els.forEach(function (e) { e.classList.add('in'); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      els.forEach(function (e) { io.observe(e); });
    }

    function metaPixel(id) {
      if (!/^\d{5,25}$/.test(String(id || '')) || window.fbq) return;
      /* Standard Meta Pixel base code */
      !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', String(id));
      window.fbq('track', 'PageView');
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    window.addEventListener('scroll', function () {
      document.getElementById('top').classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // Show the built-in content immediately, then the live version.
    render({ content: DEFAULTS, currency: 'USD', instructors: [] });
    fetch(API + '/api/landing', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.content) return;
        render(data);
        metaPixel(data.meta_pixel_id);
      })
      .catch(function () { /* keep the built-in content */ });
  })();
  </script>
