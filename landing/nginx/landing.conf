# Marketing landing page — served straight from the git checkout, so
# deploying is just `git pull`.
#
# 1. Replace  go.learnexity.org  below with the subdomain you choose.
# 2. Change the `root` line if the repo is not at /var/www/learnexity.
# 3. Start with this HTTP-only block, then run:
#      certbot --nginx -d go.learnexity.org
#    which adds HTTPS + the redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name go.learnexity.org;
    root /var/www/learnexity/landing;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /favicon.ico { try_files $uri =404; }
    location /assets/ {
        location ~* \.(png|jpe?g|webp|svg|ico)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
        return 404;
    }
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 404; }
}
