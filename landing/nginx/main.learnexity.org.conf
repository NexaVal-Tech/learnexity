# Marketing landing page — https://main.learnexity.org
# Served straight from the git checkout, so updating it is just `git pull`.
#
# Install (on the server):
#   sudo cp /var/www/learnexity/landing/nginx/main.learnexity.org.conf /etc/nginx/sites-available/main.learnexity.org
#   sudo ln -s /etc/nginx/sites-available/main.learnexity.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d main.learnexity.org      # adds HTTPS + redirect

server {
    listen 80;
    listen [::]:80;
    server_name main.learnexity.org;
    root /var/www/learnexity/landing;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Only GET/HEAD — this is a static page.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /index.html { return 301 /; }
    location = /favicon.ico { try_files $uri =404; }
    location /assets/ {
        location ~* \.(png|jpe?g|webp|svg|ico)$ {
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        return 404;   # README.txt and anything else stays private
    }
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 404; }
}
