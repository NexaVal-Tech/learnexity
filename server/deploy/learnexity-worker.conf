; Supervisor config for the Laravel queue worker — sends every queued email
; (sign-up links, instructor logins, student messages, payment receipts …).
;
; It MUST process both queues: "emails" (student messages, instructor logins)
; and "default" (everything else). A worker started with only one of them
; silently leaves the other emails waiting forever.
;
; Install:
;   sudo apt-get install -y supervisor
;   sudo cp /var/www/learnexity/server/deploy/learnexity-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status            # should show learnexity-worker_00 RUNNING
; After every deploy:
;   php artisan queue:restart            # supervisor starts fresh workers with the new code

[program:learnexity-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/learnexity/server/artisan queue:work --queue=emails,default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/learnexity/server
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Must be able to write server/storage (check: ls -ld /var/www/learnexity/server/storage).
; If that folder is owned by root, change this to user=root.
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/learnexity/server/storage/logs/worker.log
stopwaitsecs=130
